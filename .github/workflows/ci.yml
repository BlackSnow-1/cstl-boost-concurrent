name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  containers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/verify_vendor.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCSTL_BUILD_TESTS=ON -DCSTL_BUILD_UPSTREAM_TESTS=ON -DCSTL_BUILD_EXAMPLES=ON -DCSTL_BUILD_BENCHMARKS=ON
      - run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure --parallel 2
      - run: cmake --install build --config ${{ matrix.config }} --prefix install
  sanitizers:
    name: ${{ matrix.sanitizer }} (Linux)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [ASAN, TSAN, UBSAN]
    env:
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
      TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/.github/tsan.supp
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      # Keep the hosted runner's ASLR layout compatible with TSan's shadow memory.
      - if: matrix.sanitizer == 'TSAN'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCSTL_BUILD_TESTS=ON -DCSTL_ENABLE_${{ matrix.sanitizer }}=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  memcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCSTL_BUILD_TESTS=ON
      - run: cmake --build build --parallel 2
      - name: Check project tests for memory errors
        run: |
          for test in cstl_tests cstl_boost_map_tests; do
            valgrind --tool=memcheck --track-origins=yes --leak-check=full \
              --errors-for-leak-kinds=definite,possible --error-exitcode=1 "build/$test"
          done
  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-18
      - name: Configure Clang Static Analyzer checks
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCSTL_BUILD_TESTS=ON \
            '-DCMAKE_CXX_CLANG_TIDY=clang-tidy-18;--checks=-*,clang-analyzer-core.*,clang-analyzer-cplusplus.*;--warnings-as-errors=clang-analyzer-*;--header-filter=/include/cstl/[^/]+[.]hpp$'
      - run: cmake --build build --parallel 2
