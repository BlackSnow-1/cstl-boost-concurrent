name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  containers:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        config: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/verify_vendor.py
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCSTL_BUILD_TESTS=ON -DCSTL_BUILD_EXAMPLES=ON -DCSTL_BUILD_BENCHMARKS=ON
      - run: cmake --build build --config ${{ matrix.config }} --parallel 2
      - run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure
      - run: cmake --install build --config ${{ matrix.config }} --prefix install
  boost-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCSTL_BUILD_UPSTREAM_TESTS=ON
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure --parallel 2
